<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFTY-FIVE — GTA VI Trophy Ledger (v2 Restructure)</title>
  <meta name="description" content="Numbered source-cited trophy ledger for Grand Theft Auto VI featuring 55 cited guides, 4 checked sources, 8-stage roadmap grid, and 3-pane audit tracker.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div id="55-mark">55</div>
    <h1 id="title">FIFTY-FIVE — GTA VI Trophy Ledger</h1>
    <div id="earned-count-display">
      <span id="count-platinum">0</span>P / <span id="count-gold">0</span>G / <span id="count-silver">0</span>S / <span id="count-bronze">0</span>B
    </div>
    <button id="export-btn">Export</button>
    <input type="file" id="import-file">
    <button id="spoiler-toggle">Toggle Spoilers</button>
  </header>

  <div id="audit-strip"></div>

  <div id="missables-banner" class="amber-banner">
    <span class="banner-icon">⚠️</span>
    <span class="banner-text"><strong>1 Reported Missable:</strong> Meditate at Jason's house during Chapter 1 (Positive Mental Attitude). Cheats disable trophies &amp; saving.</span>
  </div>

  <nav class="tab-bar">
    <button class="tab-btn" data-target="tracker">Tracker</button>
    <button class="tab-btn" data-target="roadmap">Roadmap (8 Stages)</button>
    <button class="tab-btn" data-target="missables">Missables &amp; Cautions</button>
  </nav>
  <main>
    <div id="tracker-section" class="tab-pane">
      <div class="filter-row">
        <select id="grade-filter"><option>All Grades</option></select>
        <select id="sort-control"><option>Sort By</option></select>
        <input type="text" id="search-input" placeholder="Search...">
      </div>
      <div class="panes">
        <section id="checklist-pane"></section>
        <section id="detail-pane"></section>
        <aside id="sources-rail"></aside>
      </div>
    </div>
  <div id="roadmap-container" class="tab-pane"></div>
  <div id="missables-container" class="tab-pane"></div>
</main>

<script defer src="js/storage.js"></script>
<script defer src="js/spoilers.js"></script>
<script defer src="js/filters.js"></script>
<script defer src="js/guides.js"></script>
<script defer src="js/roadmap.js"></script>
<script defer src="js/missables.js"></script>
<script defer src="js/tracker.js"></script>
<script defer src="js/app.js"></script>
<span id="hidden-stats-text" style="display: none;"></span>
</body>
</html>
